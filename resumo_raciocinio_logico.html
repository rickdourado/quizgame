<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>🔒 Acesso Restrito — Portal de Estudos TIC</title>
  <meta name="theme-color" content="#090d16">
  <style>
    :root {
      --bg: #090d16;
      --card: #111827;
      --border: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #10b981;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: radial-gradient(circle at 50% 20%, rgba(16, 185, 129, 0.12), transparent 55%), var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .lock-card {
      width: 100%;
      max-width: 390px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 32px 26px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }
    .lock-icon {
      width: 56px;
      height: 56px;
      border-radius: 16px;
      background: rgba(16, 185, 129, 0.14);
      border: 1px solid rgba(16, 185, 129, 0.35);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 1.7rem;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 1.35rem;
      font-weight: 800;
      margin-bottom: 6px;
    }
    p.sub {
      font-size: 0.86rem;
      color: var(--muted);
      margin-bottom: 22px;
      line-height: 1.45;
    }
    .pin-input {
      width: 100%;
      padding: 13px 16px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: #0b0f19;
      color: var(--text);
      font-size: 1.15rem;
      font-weight: 700;
      text-align: center;
      letter-spacing: 0.2em;
      margin-bottom: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    .pin-input:focus {
      border-color: var(--accent);
    }
    .remember-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 0.82rem;
      color: var(--muted);
      margin-bottom: 18px;
      cursor: pointer;
    }
    .btn-unlock {
      width: 100%;
      padding: 13px 16px;
      border-radius: 12px;
      border: none;
      background: var(--accent);
      color: #042f2e;
      font-size: 0.95rem;
      font-weight: 800;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-unlock:hover {
      background: #34d399;
    }
    .err-msg {
      color: #f87171;
      font-size: 0.82rem;
      font-weight: 600;
      margin-top: 12px;
      min-height: 1.2em;
    }
  </style>
</head>
<body>
  <div class="lock-card" id="lock-box">
    <div class="lock-icon">🔒</div>
    <h1>Portal Privado de Estudos</h1>
    <p class="sub">Conteúdo protegido com criptografia AES-256-GCM. Digite seu PIN pessoal para acessar.</p>
    <form id="unlock-form">
      <input type="password" id="pin-field" class="pin-input" placeholder="••••••" inputmode="numeric" autocomplete="current-password" required autofocus>
      <label class="remember-row">
        <input type="checkbox" id="remember-chk" checked>
        <span>Lembrar acesso neste aparelho</span>
      </label>
      <button type="submit" class="btn-unlock" id="unlock-btn">Desbloquear Portal →</button>
      <div class="err-msg" id="err-msg"></div>
    </form>
  </div>

  <script>
    (function() {
      const payload = JSON.parse(document.getElementById('enc-payload').textContent);

      function b64ToBytes(b64) {
        const bin = atob(b64);
        const len = bin.length;
        const bytes = new Uint8Array(len);
        for (let i = 0; i < len; i++) bytes[i] = bin.charCodeAt(i);
        return bytes;
      }

      async function tryDecrypt(pin) {
        const enc = new TextEncoder();
        const salt = b64ToBytes(payload.s);
        const iv = b64ToBytes(payload.iv);
        const data = b64ToBytes(payload.ct);

        const baseKey = await crypto.subtle.importKey(
          'raw', enc.encode(pin), 'PBKDF2', false, ['deriveKey']
        );
        const aesKey = await crypto.subtle.deriveKey(
          { name: 'PBKDF2', salt: salt, iterations: 100000, hash: 'SHA-256' },
          baseKey,
          { name: 'AES-GCM', length: 256 },
          false,
          ['decrypt']
        );
        const decryptedBuf = await crypto.subtle.decrypt(
          { name: 'AES-GCM', iv: iv },
          aesKey,
          data
        );
        if (payload.z && typeof DecompressionStream !== 'undefined') {
          const ds = new DecompressionStream('gzip');
          const stream = new Blob([decryptedBuf]).stream().pipeThrough(ds);
          return await new Response(stream).text();
        }
        return new TextDecoder().decode(decryptedBuf);
      }

      function renderHtml(htmlText) {
        document.open();
        document.write(htmlText);
        document.close();
      }

      async function boot() {
        const savedPin = localStorage.getItem('portal_pin') || sessionStorage.getItem('portal_pin');
        if (savedPin) {
          document.getElementById('unlock-btn').textContent = 'Desbloqueando automaticamente...';
          try {
            const html = await tryDecrypt(savedPin);
            renderHtml(html);
            return;
          } catch (e) {
            localStorage.removeItem('portal_pin');
            sessionStorage.removeItem('portal_pin');
            document.getElementById('unlock-btn').textContent = 'Desbloquear Portal →';
          }
        }
      }

      document.getElementById('unlock-form').addEventListener('submit', async function(ev) {
        ev.preventDefault();
        const pin = document.getElementById('pin-field').value.trim();
        const remember = document.getElementById('remember-chk').checked;
        const errEl = document.getElementById('err-msg');
        const btn = document.getElementById('unlock-btn');
        errEl.textContent = '';
        btn.textContent = 'Desbloqueando...';
        try {
          const html = await tryDecrypt(pin);
          if (remember) {
            localStorage.setItem('portal_pin', pin);
          } else {
            sessionStorage.setItem('portal_pin', pin);
          }
          renderHtml(html);
        } catch (e) {
          btn.textContent = 'Desbloquear Portal →';
          errEl.textContent = 'PIN incorreto. Tente novamente.';
          document.getElementById('pin-field').select();
        }
      });

      boot();
    })();
  </script>
